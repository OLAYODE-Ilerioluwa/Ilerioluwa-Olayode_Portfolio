<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="menu.css">
    <title>Menu - YUKI</title>

<body>

    <nav>
        <img class="logo-img" src="Image/Sleek_logo_design_for__Yuki__restaurant-removebg-preview.png" alt="Yuki">
        <input type="checkbox" id="nav-toggle" class="nav-toggle-cb">
        <label for="nav-toggle" class="nav-burger" aria-label="Ouvrir le menu"><span></span><span></span><span></span></label>
        <div class="nav-links">
            <a href="index.html">Accueil</a>
            <a href="menu.html">Menu</a>
            <a href="avis.html">Avis</a>
            <a href="index.html#contact">Contact</a>

    </nav>

    <div class="menu-hero">
        <h1>Notre Menu</h1>
        <p>Une cuisine japonaise authentique</p>
    </div>

    <section class="menu-page">
        <div class="filtres">
            <button class="filtre actif" data-filtre="tout">Tout</button>

        <div class="plats-container" id="grille-menu"></div>
        </div>
    </section>
