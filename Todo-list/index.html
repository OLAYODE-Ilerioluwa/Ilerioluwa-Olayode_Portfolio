<!doctype html>
<html lang="en">

<head>
   
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Hello World</title>
</head>


<body>

    <div class="container">

        <div class="row mt-3">
            <div class="col offset-2">
                <h1>Mes tâches</h1>
            </div>
        </div>

        <form class="row mt-3" id="formAddTask">
            <input type="hidden" name="action" value="add_task">
            
            <div class="col-6 offset-2">
                <label for="inputTaskName" class="visually-hidden">Tâche</label>
                <input type="text" class="form-control" name="taskName" id="inputTaskName" placeholder="Tâche" required>
            </div>

            <div class="col-4">
                <button type="submit" class="btn btn-primary mb-3"> Ajouter</button>
            </div>

        </form>  

        <div class="row">
            <div class="col-7 offset-2">
                <table class="table table-bordered table-striped table-hover">
                    <thead>
                        <th>Fait</th>
                        <th>Nom</th>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="text-center"style="width: 10%;"><input  type="checkbox" class="form-check-input"></td>
                            <td>Nom de la tâche</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>

    </div>
        
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
    crossorigin="anonymous"></script>

    
</body>

</html>
