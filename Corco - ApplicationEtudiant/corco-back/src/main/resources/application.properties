server.port=8080

# Connexion à ta base MySQL dans Docker (base "corco")
spring.datasource.url=jdbc:mysql://localhost:3306/corco?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# Génération automatique des tables par Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true